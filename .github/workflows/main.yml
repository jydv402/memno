on:
  push:
    branches:
      - release

name: Build Memno App

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v2

      - name: Setup JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Flutter clean
        run: flutter clean

      - name: Getting Dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo $VERSION | cut -d'+' -f1)
          VERSION_CODE=$(echo $VERSION | cut -d'+' -f2)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Decode keystore from GitHub Secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties


      - name: Building signed APK 
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Rename APK files
        run: |
          cd build/app/outputs/flutter-apk
          mv app-armeabi-v7a-release.apk memno-armeabi-v7a-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk
          mv app-arm64-v8a-release.apk memno-arm64-v8a-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk
          mv app-x86_64-release.apk memno-x86_64-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk
          mv app-release.apk memno-universal-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk

      - name: Upload APK
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/memno-armeabi-v7a-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk,build/app/outputs/flutter-apk/memno-arm64-v8a-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk,build/app/outputs/flutter-apk/memno-x86_64-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk,build/app/outputs/flutter-apk/memno-universal-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk"
          tag: ${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}
          name: Memno v${{ steps.version.outputs.version_name }}
          body: |
            ### Release Notes
            - Version: ${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}
            ---

            ### Which APK file should I download?
            This release includes optimized APK files for different device architectures as well as a universal installer. Please choose the appropriate file for your device:
            
            *   **`memno-arm64-v8a-...apk`**: For almost all modern Android phones and tablets (64-bit ARM devices).
            *   **`memno-armeabi-v7a-...apk`**: For older 32-bit Android phones and tablets.
            *   **`memno-x86_64-...apk`**: For Android Emulators, ChromeOS/Chromebooks, or Intel/AMD-powered Android devices.
            *   **`memno-universal-...apk`**: For all devices (Universal fat APK). Download this if you're unsure or having issues installing arch-specific versions.
            
            ---
            *Note: If you are not sure, try downloading the **`universal`** version.*
          token: ${{ secrets.MEMNO_TOKEN }}
