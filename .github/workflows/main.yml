on:
  push:
    branches:
      - release

name: Build Memno App

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Flutter clean
        run: flutter clean

      - name: Getting Dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo $VERSION | cut -d'+' -f1)
          VERSION_CODE=$(echo $VERSION | cut -d'+' -f2)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Decode keystore from GitHub Secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Building signed APK 
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Rename APK files
        run: |
          cd build/app/outputs/flutter-apk
          mv app-armeabi-v7a-release.apk memno-armeabi-v7a-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk
          mv app-arm64-v8a-release.apk memno-arm64-v8a-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk
          mv app-x86_64-release.apk memno-x86_64-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk
          mv app-release.apk memno-universal-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/app/outputs/flutter-apk/memno-*.apk

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter clean
        run: flutter clean

      - name: Getting Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Extract version from pubspec.yaml
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo $VERSION | cut -d'+' -f1)
          VERSION_CODE=$(echo $VERSION | cut -d'+' -f2)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Compile Inno Setup Installer
        shell: cmd
        run: iscc /dAppVersion=${{ steps.version.outputs.version_name }} windows/installer.iss

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/x64/runner/memno-windows-*.exe

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-android, build-windows]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo $VERSION | cut -d'+' -f1)
          VERSION_CODE=$(echo $VERSION | cut -d'+' -f2)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Consolidate Artifacts
        run: |
          mkdir consolidated-release
          find release-artifacts -type f -exec cp {} consolidated-release/ \;
          ls -R consolidated-release

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "consolidated-release/*"
          tag: ${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}
          name: Memno v${{ steps.version.outputs.version_name }}
          body: |
            ### Release Notes
            - Version: ${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}
            ---

            ### Which file should I download?
            
            #### Windows
            *   **`memno-windows-x64-...exe`**: Standard Windows Installer. Run the installer to install Memno on your system. Your application data and database are stored centrally inside your User Profile directory: `C:\Users\<Username>\.memno\`.

            #### Android
            Please choose the appropriate APK file for your device architecture:
            
            *   **`memno-arm64-v8a-...apk`**: For almost all modern Android phones and tablets (64-bit ARM devices).
            *   **`memno-armeabi-v7a-...apk`**: For older 32-bit Android phones and tablets.
            *   **`memno-x86_64-...apk`**: For Android Emulators, ChromeOS/Chromebooks, or Intel/AMD-powered Android devices.
            *   **`memno-universal-...apk`**: For all devices (Universal fat APK). Download this if you're unsure or having issues installing arch-specific versions.
            
            ---
            *Note: For Android, if you are not sure, try downloading the **`universal`** version.*
          token: ${{ secrets.MEMNO_TOKEN }}
