AutoName: memno

RepoType: git
Repo: https://github.com/jydv402/memno

Builds:
  - versionName: 1.3.4
    versionCode: 131
    commit: 6e3e1d6b4cf00f90f5a3b7ad769510f02aaa8035
    sudo:
      - mkdir -p /home/runner/work/memno
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-withoutota-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/main.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/memno/memno
      - cd ..
      - mv com.jdmakes.memno $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo com.jdmakes.memno
    scanignore:
      - android/
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/memno/memno
      - cd ..
      - mv com.jdmakes.memno $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
        --flavor withoutOTA --dart-define=UPDATE_LOGIC=withoutOTA
      - popd
      - mv $repo com.jdmakes.memno

